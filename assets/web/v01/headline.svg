<text x="76" y="710" font-size="17" font-weight="700">What this first version shows</text>
<text x="76" y="736" font-size="14" fill="#50606d">Convulsive seizures: 95–97 % caught at one false alarm a day — smartwatch territory, with two ear electrodes. Every learned model beats every single-signal rule</text>
<text x="76" y="758" font-size="14" fill="#50606d">by a wide margin (rules: F1 0.09–0.13, 33–58 false alarms/day). Adding heart, muscle and movement to EEG (C vs A): +11 points at 1 FA/day, F1 +0.064 [+0.023, +0.095],</text>
<text x="76" y="780" font-size="14" fill="#50606d">P(improve) = 0.998, better in all 5 folds. ECG alone (B vs A) is not a robust gain.</text>
<text x="76" y="802" font-size="14" fill="#50606d">Where it fails: 82 % of missed seizures were visible on some signal but short (median 17 s vs 80 s for detected). Three patients with 10–13 s seizures hold 28 % of all</text>
<text x="76" y="824" font-size="14" fill="#50606d">seizures; the 4-s window + 3-of-5 rule needs ~10 s of evidence — the next versions target this. Known defect: the threshold depends on the random seed (one fold:</text>
<text x="76" y="846" font-size="14" fill="#50606d">50.9 vs &lt; 9 FA/day); v03 tests a fix. False alarms are counted on the hardest hours only; v02 adds the 6,400 seizure-free hours.</text>
<text x="56" y="902" font-size="12" fill="#9aa5ae">Reference: the 2025 SzCORE challenge winner (19-channel scalp EEG, hidden hospital set) reached F1 32 %, sensitivity 37 %, 1.3 FA/day. ICTRA v01 Model C: F1 0.32, sensitivity 0.44, ~10 FA/day on development folds</text>
<text x="56" y="920" font-size="12" fill="#9aa5ae">with 2 behind-the-ear channels — same order of magnitude, 8× the false alarms, not yet on unseen patients. Source: results/dev/v01_baseline/REPORT.md, 17 Oct 2026.</text>
</svg>