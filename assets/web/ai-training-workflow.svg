<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" fill="#1d2b36" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1536" height="1024" fill="#f8fafb"/>
<text x="56" y="64" font-size="30" font-weight="700">How ICTRA turns four recorded signals into one alarm decision</text>
<text x="56" y="96" font-size="17" fill="#50606d">Every box is a real step in src/ictra_lib.py · SeizeIT2 development patients only · identical path for training and for any test recording</text>

<!-- Stage 1: signals -->
<g>
<text x="56" y="160" font-size="20" font-weight="700">1 · Aligned recordings</text>
<text x="56" y="184" font-size="14" fill="#50606d">256 Hz, one clock · impd and flat stretches masked</text>
<rect x="56" y="200" width="380" height="560" rx="10" fill="#fff" stroke="#d6dee4"/>
<!-- EEG left -->
<text x="76" y="240" font-size="15" font-weight="700" fill="#2a78d6">bte-EEG L</text><text x="76" y="258" font-size="12" fill="#50606d">behind-the-ear · 1–25 Hz</text>
<polyline fill="none" stroke="#2a78d6" stroke-width="2" points="200,246 212,238 222,254 234,240 246,252 258,236 270,250 282,242 294,256 306,238 318,250 330,244 342,254 354,236 366,250 378,244 390,252 402,240 414,248"/>
<!-- EEG right -->
<text x="76" y="320" font-size="15" font-weight="700" fill="#2a78d6">bte-EEG R</text><text x="76" y="338" font-size="12" fill="#50606d">2nd channel · L / R / gen.</text>
<polyline fill="none" stroke="#2a78d6" stroke-width="2" points="200,326 214,334 226,318 238,330 250,322 262,336 274,324 286,332 298,316 310,330 322,322 334,334 346,320 358,332 370,324 382,336 394,322 406,330 414,326"/>
<!-- ECG -->
<text x="76" y="400" font-size="15" font-weight="700" fill="#d95926">ECG</text><text x="76" y="418" font-size="12" fill="#50606d">chest · R-peaks → HR</text>
<polyline fill="none" stroke="#d95926" stroke-width="2" points="200,406 230,406 236,412 240,382 245,422 250,406 290,406 296,412 300,382 305,422 310,406 350,406 356,412 360,382 365,422 370,406 414,406"/>
<!-- EMG -->
<text x="76" y="480" font-size="15" font-weight="700" fill="#199e70">EMG</text><text x="76" y="498" font-size="12" fill="#50606d">left deltoid · 20–120 Hz</text>
<polyline fill="none" stroke="#199e70" stroke-width="2" points="200,486 240,485 270,487 300,484 316,470 320,500 324,474 328,498 332,478 336,496 340,486 380,485 414,486"/>
<!-- ACC -->
<text x="76" y="560" font-size="15" font-weight="700" fill="#6b4fbb">ACC + GYR</text><text x="76" y="578" font-size="12" fill="#50606d">25 Hz · in sensor units</text>
<polyline fill="none" stroke="#6b4fbb" stroke-width="2" points="200,566 250,566 300,565 320,556 330,576 340,560 350,572 360,566 414,566"/>
<!-- events -->
<rect x="76" y="610" width="340" height="1" fill="#d6dee4"/>
<text x="76" y="640" font-size="15" font-weight="700">events.tsv</text>
<text x="76" y="660" font-size="12" fill="#50606d">clinician onset / offset · seizure type</text>
<rect x="250" y="626" width="120" height="22" rx="4" fill="#fde7df" stroke="#d95926"/>
<text x="310" y="641" font-size="12" text-anchor="middle" fill="#9a3412">seizure</text>
<text x="76" y="700" font-size="13" fill="#50606d">883 seizures · 125 patients</text>
<text x="76" y="720" font-size="13" fill="#50606d">55 FBTC · 371 focal motor · 324 non-motor · 133 unknown</text>
</g>

<!-- arrow -->
<path d="M446 480 h40" stroke="#0d6c86" stroke-width="3" fill="none" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d6c86"/></marker></defs>

<!-- Stage 2: windows -->
<g>
<text x="500" y="160" font-size="20" font-weight="700">2 · Windows</text>
<text x="500" y="184" font-size="14" fill="#50606d">4 s long · 2 s hop (50 % overlap)</text>
<rect x="500" y="200" width="250" height="560" rx="10" fill="#fff" stroke="#d6dee4"/>
<g font-size="12" fill="#50606d">
<rect x="520" y="240" width="160" height="34" rx="4" fill="#dcedf3" stroke="#0d6c86"/><text x="528" y="262">w₁  0–4 s</text>
<rect x="560" y="284" width="160" height="34" rx="4" fill="#dcedf3" stroke="#0d6c86"/><text x="568" y="306">w₂  2–6 s</text>
<rect x="520" y="328" width="160" height="34" rx="4" fill="#dcedf3" stroke="#0d6c86"/><text x="528" y="350">w₃  4–8 s</text>
<rect x="560" y="372" width="160" height="34" rx="4" fill="#dcedf3" stroke="#0d6c86"/><text x="568" y="394">w₄  6–10 s</text>
<text x="520" y="440">…</text>
</g>
<text x="520" y="500" font-size="13" fill="#1d2b36" font-weight="700">Label per window</text>
<text x="520" y="520" font-size="12" fill="#50606d">seizure if ≥ 50 % overlaps</text>
<text x="520" y="538" font-size="12" fill="#50606d">an annotated seizure</text>
<text x="520" y="580" font-size="13" fill="#1d2b36" font-weight="700">Excluded</text>
<text x="520" y="600" font-size="12" fill="#50606d">boundary windows (edge)</text>
<text x="520" y="618" font-size="12" fill="#50606d">impedance checks (impd)</text>
<text x="520" y="636" font-size="12" fill="#50606d">flat / saturated stretches</text>
<text x="520" y="700" font-size="13" fill="#50606d">Rolling 5-min baseline kept</text>
<text x="520" y="718" font-size="13" fill="#50606d">per recording for Δ-features</text>
</g>

<path d="M760 480 h40" stroke="#0d6c86" stroke-width="3" fill="none" marker-end="url(#a)"/>

<!-- Stage 3: features -->
<g>
<text x="814" y="160" font-size="20" font-weight="700">3 · Physical features</text>
<text x="814" y="184" font-size="14" fill="#50606d">one row per window · the real column names</text>
<rect x="814" y="200" width="330" height="560" rx="10" fill="#fff" stroke="#d6dee4"/>
<g font-size="12">
<text x="832" y="236" font-weight="700" fill="#2a78d6">EEG (per channel)</text>
<text x="832" y="256" fill="#50606d">band power δ θ α β (1–4 / 4–8 / 8–13 / 13–25 Hz)</text>
<text x="832" y="274" fill="#50606d">line length · variance · zero-crossings</text>
<text x="832" y="292" fill="#50606d">spectral edge · kurtosis · Δ vs 5-min median</text>
<text x="832" y="330" font-weight="700" fill="#d95926">ECG</text>
<text x="832" y="350" fill="#50606d">HR mean / max · HR rise vs baseline (bpm, %)</text>
<text x="832" y="368" fill="#50606d">SDNN · RMSSD · HR slope · beat-quality flag</text>
<text x="832" y="406" font-weight="700" fill="#199e70">EMG</text>
<text x="832" y="426" fill="#50606d">log-RMS envelope · zero-crossings</text>
<text x="832" y="444" fill="#50606d">burst fraction · Δ vs baseline</text>
<text x="832" y="482" font-weight="700" fill="#6b4fbb">ACC</text>
<text x="832" y="502" fill="#50606d">|a| mean / std · jerk · 1–8 Hz power</text>
<text x="832" y="540" font-weight="700">Masks</text>
<text x="832" y="560" fill="#50606d">flat_eeg · flat_ecg · flat_emg · edge · impd</text>
<text x="832" y="578" fill="#50606d">missing signal → NaN, never filled as "normal"</text>
</g>
<!-- mini table -->
<g font-size="10" fill="#50606d">
<rect x="832" y="610" width="294" height="110" fill="#f4f6f8" stroke="#d6dee4"/>
<text x="840" y="626">win   eeg_ll_L  hr_rise  emg_rms  acc_jerk  y</text>
<text x="840" y="646">w₁    0.21     +1.3     0.08     0.02      0</text>
<text x="840" y="664">w₂    0.24     +0.9     0.07     0.01      0</text>
<text x="840" y="682">w₃    0.88     +34.0    0.61     0.40      1</text>
<text x="840" y="700">w₄    0.95     +41.2    0.74     0.52      1</text>
<text x="840" y="716" fill="#9aa5ae">values illustrative; columns real</text>
</g>
</g>

<path d="M1154 480 h40" stroke="#0d6c86" stroke-width="3" fill="none" marker-end="url(#a)"/>

<!-- Stage 4: model + decision -->
<g>
<text x="1208" y="160" font-size="20" font-weight="700">4 · Model → alarm</text>
<text x="1208" y="184" font-size="14" fill="#50606d">gradient-boosted trees · fixed decision rule</text>
<rect x="1208" y="200" width="272" height="560" rx="10" fill="#fff" stroke="#d6dee4"/>
<!-- trees -->
<g stroke="#0d6c86" stroke-width="2" fill="#dcedf3">
<circle cx="1260" cy="250" r="8"/><circle cx="1240" cy="280" r="8"/><circle cx="1280" cy="280" r="8"/><circle cx="1230" cy="310" r="6"/><circle cx="1250" cy="310" r="6"/><circle cx="1270" cy="310" r="6"/><circle cx="1290" cy="310" r="6"/>
<path d="M1260 258 L1240 272 M1260 258 L1280 272 M1240 288 L1230 304 M1240 288 L1250 304 M1280 288 L1270 304 M1280 288 L1290 304" fill="none"/>
<circle cx="1350" cy="250" r="8"/><circle cx="1330" cy="280" r="8"/><circle cx="1370" cy="280" r="8"/><circle cx="1320" cy="310" r="6"/><circle cx="1340" cy="310" r="6"/><circle cx="1360" cy="310" r="6"/><circle cx="1380" cy="310" r="6"/>
<path d="M1350 258 L1330 272 M1350 258 L1370 272 M1330 288 L1320 304 M1330 288 L1340 304 M1370 288 L1360 304 M1370 288 L1380 304" fill="none"/>
<text x="1400" y="286" font-size="18" fill="#0d6c86" stroke="none">…</text>
</g>
<text x="1226" y="346" font-size="13" font-weight="700">XGBoost (GPU) · LightGBM</text>
<text x="1226" y="364" font-size="12" fill="#50606d">logit and random forest as comparisons</text>
<text x="1226" y="382" font-size="12" fill="#50606d">class ratio 1 : 10 · 3 seeds</text>
<rect x="1226" y="400" width="236" height="30" rx="4" fill="#dcedf3"/>
<text x="1344" y="420" font-size="13" text-anchor="middle" font-weight="700" fill="#0d6c86">p(seizure) per 4-s window</text>
<!-- kofn -->
<text x="1226" y="470" font-size="13" font-weight="700">Decision rule: k-of-n = 3 of 5</text>
<g font-size="11">
<rect x="1226" y="482" width="40" height="26" rx="3" fill="#f4f6f8" stroke="#d6dee4"/><text x="1246" y="500" text-anchor="middle" fill="#50606d">0.21</text>
<rect x="1272" y="482" width="40" height="26" rx="3" fill="#fde7df" stroke="#d95926"/><text x="1292" y="500" text-anchor="middle" fill="#9a3412">0.81</text>
<rect x="1318" y="482" width="40" height="26" rx="3" fill="#f4f6f8" stroke="#d6dee4"/><text x="1338" y="500" text-anchor="middle" fill="#50606d">0.44</text>
<rect x="1364" y="482" width="40" height="26" rx="3" fill="#fde7df" stroke="#d95926"/><text x="1384" y="500" text-anchor="middle" fill="#9a3412">0.90</text>
<rect x="1410" y="482" width="40" height="26" rx="3" fill="#fde7df" stroke="#d95926"/><text x="1430" y="500" text-anchor="middle" fill="#9a3412">0.93</text>
</g>
<text x="1226" y="530" font-size="12" fill="#50606d">3 of the last 5 windows ≥ τ → alarm</text>
<text x="1226" y="548" font-size="12" fill="#50606d">τ tuned on an inner split of the</text>
<text x="1226" y="566" font-size="12" fill="#50606d">training patients, then frozen</text>
<text x="1226" y="584" font-size="12" fill="#50606d">alarms &lt; 90 s apart merge</text>
<rect x="1226" y="610" width="236" height="44" rx="6" fill="#d03b3b"/>
<text x="1344" y="638" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">ALARM (event)</text>
<text x="1226" y="690" font-size="12" fill="#50606d">Scored per event (SzCORE):</text>
<text x="1226" y="708" font-size="12" fill="#50606d">sensitivity · FA / 24 h · delay · F1</text>
<text x="1226" y="726" font-size="12" fill="#50606d">by seizure type, patient-bootstrap CI</text>
</g>

<!-- footer -->
<rect x="56" y="800" width="1424" height="1" fill="#d6dee4"/>
<text x="56" y="840" font-size="15" font-weight="700">Beside every model: four single-signal rules</text>
<text x="56" y="864" font-size="14" fill="#50606d">rule_hr (heart-rate rise) · rule_emg (EMG level) · rule_eeg (line length) · rule_acc (movement) — each tuned with the same inner split and the same k-of-n rule.</text><text x="56" y="884" font-size="14" fill="#50606d">A model counts only if it beats them.</text>
<text x="56" y="910" font-size="15" font-weight="700">What this diagram is not</text>
<text x="56" y="934" font-size="14" fill="#50606d">Not patient data and not a fitted model: the waveforms and table values are illustrative. The steps, parameters and column families are the ones in the code.</text>
<text x="56" y="980" font-size="12" fill="#9aa5ae">ICTRA · WAICY 2026 · diagram drawn from src/ictra_lib.py and docs/EVALUATION_PROTOCOL.md · 17 Oct 2026</text>
</svg>
