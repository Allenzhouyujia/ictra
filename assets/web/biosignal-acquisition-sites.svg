<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" fill="#1d2b36" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1536" height="1024" fill="#f8fafb"/>
<text x="56" y="64" font-size="30" font-weight="700">Where the four signals are recorded — the SeizeIT2 wearable layout ICTRA trains on</text>
<text x="56" y="96" font-size="17" fill="#50606d">Three small sensor units (Byteflies Sensor Dot). Schematic positions, not a placement protocol; the same sites are the target for the team's own board.</text>

<!-- Body: front view -->
<g stroke="#8a98a4" stroke-width="2.5" fill="#fff">
<!-- head -->
<ellipse cx="420" cy="230" rx="62" ry="74"/>
<!-- neck -->
<rect x="400" y="300" width="40" height="34" rx="6"/>
<!-- torso -->
<path d="M300 340 Q420 322 540 340 L560 620 Q420 650 280 620 Z"/>
<!-- arms -->
<path d="M300 345 L240 380 L200 560 L240 570 L275 420"/>
<path d="M540 345 L600 380 L640 560 L600 570 L565 420"/>
</g>
<text x="420" y="690" font-size="13" text-anchor="middle" fill="#9aa5ae">front view · patient's left is on the viewer's right</text>

<!-- Head side view (left side of head, behind the ear) -->
<g stroke="#8a98a4" stroke-width="2.5" fill="#fff">
<ellipse cx="860" cy="250" rx="110" ry="125"/>
<!-- ear -->
<path d="M805 225 q-28 0 -26 32 q4 30 28 28"/>
<!-- nose hint -->
<path d="M968 250 l14 20 l-16 6" fill="none"/>
</g>
<text x="860" y="410" font-size="13" text-anchor="middle" fill="#9aa5ae">left side of the head</text>

<!-- bte-EEG electrodes behind ear -->
<g>
<circle cx="770" cy="238" r="9" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
<circle cx="776" cy="280" r="9" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
<rect x="748" y="300" width="36" height="22" rx="5" fill="#2a78d6"/>
<path d="M770 247 L772 300 M776 289 L772 300" stroke="#2a78d6" stroke-width="2" fill="none"/>
<path d="M784 311 H1000" stroke="#2a78d6" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<rect x="1000" y="150" width="480" height="190" rx="10" fill="#fff" stroke="#2a78d6"/>
<text x="1020" y="182" font-size="18" font-weight="700" fill="#2a78d6">bte-EEG · behind-the-ear EEG · 2 channels</text>
<text x="1020" y="208" font-size="13" fill="#50606d">Electrodes on the mastoid / behind the ear, one unit per side</text>
<text x="1020" y="228" font-size="13" fill="#50606d">256 Hz · model band 1–25 Hz · montage left / right / generalized</text>
<text x="1020" y="248" font-size="13" fill="#50606d">Catches: rhythmic ictal discharges, electrodecrement</text>
<text x="1020" y="268" font-size="13" fill="#50606d">Misses: seizures deep or far from the temporal lobes —</text>
<text x="1020" y="288" font-size="13" fill="#50606d">reported as "seizures the ear-EEG never shows"</text>
<text x="1020" y="316" font-size="13" font-weight="700">→ Model A, B, C · rule_eeg</text>
</g>

<!-- ECG chest -->
<g>
<circle cx="400" cy="420" r="9" fill="#d95926" stroke="#fff" stroke-width="2"/>
<circle cx="470" cy="470" r="9" fill="#d95926" stroke="#fff" stroke-width="2"/>
<rect x="418" y="436" width="36" height="22" rx="5" fill="#d95926"/>
<path d="M406 427 L418 440 M462 464 L454 456" stroke="#d95926" stroke-width="2" fill="none"/>
<path d="M454 447 H1000" stroke="#d95926" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<rect x="1000" y="370" width="480" height="170" rx="10" fill="#fff" stroke="#d95926"/>
<text x="1020" y="402" font-size="18" font-weight="700" fill="#d95926">ECG · chest · 1 channel</text>
<text x="1020" y="428" font-size="13" fill="#50606d">Two gel electrodes across the upper chest, one unit</text>
<text x="1020" y="448" font-size="13" fill="#50606d">256 Hz · R-peak detection → heart rate, SDNN, RMSSD</text>
<text x="1020" y="468" font-size="13" fill="#50606d">Catches: ictal tachycardia — a jump above the 5-min baseline,</text>
<text x="1020" y="488" font-size="13" fill="#50606d">in a majority of focal seizures, sometimes before EEG onset</text>
<text x="1020" y="516" font-size="13" font-weight="700">→ Model B, C · rule_hr · ecg_only</text>
</g>

<!-- EMG left deltoid (viewer's right) -->
<g>
<circle cx="586" cy="392" r="9" fill="#199e70" stroke="#fff" stroke-width="2"/>
<circle cx="604" cy="430" r="9" fill="#199e70" stroke="#fff" stroke-width="2"/>
<rect x="612" y="395" width="36" height="22" rx="5" fill="#199e70"/>
<path d="M594 396 L612 404 M604 421 L616 417" stroke="#199e70" stroke-width="2" fill="none"/>
<path d="M648 406 H700 V620 H1000" stroke="#199e70" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<rect x="1000" y="570" width="480" height="170" rx="10" fill="#fff" stroke="#199e70"/>
<text x="1020" y="602" font-size="18" font-weight="700" fill="#199e70">EMG · left deltoid · 1 channel</text>
<text x="1020" y="628" font-size="13" fill="#50606d">Surface electrodes over the upper-arm muscle, one unit</text>
<text x="1020" y="648" font-size="13" fill="#50606d">256 Hz · 20–120 Hz envelope · burst fraction</text>
<text x="1020" y="668" font-size="13" fill="#50606d">Catches: tonic stiffening and clonic bursts of motor seizures</text>
<text x="1020" y="688" font-size="13" fill="#50606d">Misses: non-motor seizures (nothing to see by design)</text>
<text x="1020" y="716" font-size="13" font-weight="700">→ Model C · rule_emg · emg_only</text>
</g>

<!-- ACC/GYR -->
<g>
<rect x="1000" y="770" width="480" height="120" rx="10" fill="#fff" stroke="#6b4fbb"/>
<text x="1020" y="802" font-size="18" font-weight="700" fill="#6b4fbb">ACC + GYR · inside the sensor units · 25 Hz</text>
<text x="1020" y="828" font-size="13" fill="#50606d">Accelerometer and gyroscope built into the units above (no extra wearable)</text>
<text x="1020" y="848" font-size="13" fill="#50606d">Magnitude, jerk, 1–8 Hz power · the cheapest strong signal for convulsions</text>
<text x="1020" y="874" font-size="13" font-weight="700">→ Model C · rule_acc · acc_only · emg_acc</text>
<!-- small gyro icons at the units -->
<g fill="none" stroke="#6b4fbb" stroke-width="1.5">
<circle cx="766" cy="311" r="5"/><circle cx="436" cy="447" r="5"/><circle cx="630" cy="406" r="5"/>
</g>
</g>

<!-- Legend / notes -->
<rect x="56" y="740" width="900" height="150" rx="10" fill="#f1f5f7" stroke="#d6dee4"/>
<text x="76" y="772" font-size="15" font-weight="700">What the team's own board records today (BioSignal Studio, Arduino UNO R3)</text>
<text x="76" y="796" font-size="13" fill="#50606d">EEG 256 Hz · ECG 125 Hz → 256 · EMG 500 Hz → 256 · one UNO per modality · ADC counts (µV calibration pending).</text>
<text x="76" y="814" font-size="13" fill="#50606d">Same sites, same window and feature code path. Accelerometer is the next hardware revision.</text><text x="76" y="832" font-size="13" fill="#50606d">Volunteer recordings (chewing, walking, stairs, typing, sleep posture) only count false alarms on our board — never reported detection numbers.</text>
<text x="76" y="856" font-size="13" fill="#50606d">Development data coverage: 2,048 of 2,072 runs have ECG and EMG; 1,889 have movement. A missing or flat signal is masked, never filled in.</text>
<text x="76" y="874" font-size="12" fill="#9aa5ae">Not a clinical electrode-placement guide. Sites follow Bhagubai et al. 2025 (SeizeIT2).</text>

<text x="56" y="980" font-size="12" fill="#9aa5ae">ICTRA · WAICY 2026 · schematic drawn from the SeizeIT2 description and src/ictra_lib.py · 17 Oct 2026</text>
</svg>
