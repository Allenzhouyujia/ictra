<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" fill="#1d2b36" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1536" height="1024" fill="#f8fafb"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0d6c86"/></marker></defs>
<text x="56" y="64" font-size="30" font-weight="700">Three models that differ by exactly one signal block — plus the rules they must beat</text>
<text x="56" y="96" font-size="17" fill="#50606d">Separate models, trained and scored the same way on the same patient folds. Not stages feeding each other. The value of every sensor is measured, not asserted.</text>

<!-- Signal sources row -->
<g font-size="14" font-weight="700">
<rect x="56" y="140" width="200" height="54" rx="8" fill="#e3edfa" stroke="#2a78d6"/><text x="156" y="164" text-anchor="middle" fill="#2a78d6">bte-EEG · 2 ch</text><text x="156" y="184" text-anchor="middle" font-weight="400" font-size="12" fill="#50606d">band powers, line length …</text>
<rect x="290" y="140" width="200" height="54" rx="8" fill="#fde7df" stroke="#d95926"/><text x="390" y="164" text-anchor="middle" fill="#d95926">ECG · 1 ch</text><text x="390" y="184" text-anchor="middle" font-weight="400" font-size="12" fill="#50606d">HR rise, SDNN, RMSSD …</text>
<rect x="524" y="140" width="200" height="54" rx="8" fill="#def3ea" stroke="#199e70"/><text x="624" y="164" text-anchor="middle" fill="#199e70">EMG · 1 ch</text><text x="624" y="184" text-anchor="middle" font-weight="400" font-size="12" fill="#50606d">envelope, burst fraction …</text>
<rect x="758" y="140" width="200" height="54" rx="8" fill="#ebe6f7" stroke="#6b4fbb"/><text x="858" y="164" text-anchor="middle" fill="#6b4fbb">ACC + GYR</text><text x="858" y="184" text-anchor="middle" font-weight="400" font-size="12" fill="#50606d">|a|, jerk, 1–8 Hz power</text>
</g>

<!-- Model columns -->
<g>
<!-- Model A -->
<rect x="56" y="250" width="300" height="330" rx="12" fill="#fff" stroke="#d6dee4"/>
<text x="76" y="286" font-size="22" font-weight="700">Model A</text>
<text x="76" y="310" font-size="14" fill="#50606d">EEG only · set A_eeg</text>
<rect x="76" y="330" width="260" height="40" rx="6" fill="#e3edfa" stroke="#2a78d6"/><text x="206" y="355" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">EEG features</text>
<rect x="76" y="380" width="260" height="40" rx="6" fill="#f4f6f8" stroke="#d6dee4" stroke-dasharray="4 3"/><text x="206" y="405" font-size="12" text-anchor="middle" fill="#9aa5ae">—</text>
<rect x="76" y="430" width="260" height="40" rx="6" fill="#f4f6f8" stroke="#d6dee4" stroke-dasharray="4 3"/><text x="206" y="455" font-size="12" text-anchor="middle" fill="#9aa5ae">—</text>
<text x="76" y="510" font-size="13" fill="#50606d">Question it answers:</text>
<text x="76" y="530" font-size="13" font-weight="700">what the ear-EEG alone can see</text>
<text x="76" y="556" font-size="12" fill="#50606d">Reference for every comparison</text>

<!-- Model B -->
<rect x="400" y="250" width="300" height="330" rx="12" fill="#fff" stroke="#d6dee4"/>
<text x="420" y="286" font-size="22" font-weight="700">Model B</text>
<text x="420" y="310" font-size="14" fill="#50606d">EEG + ECG · set B_eeg_ecg</text>
<rect x="420" y="330" width="260" height="40" rx="6" fill="#e3edfa" stroke="#2a78d6"/><text x="550" y="355" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">EEG features</text>
<rect x="420" y="380" width="260" height="40" rx="6" fill="#fde7df" stroke="#d95926"/><text x="550" y="405" font-size="14" text-anchor="middle" fill="#d95926" font-weight="700">+ ECG features</text>
<rect x="420" y="430" width="260" height="40" rx="6" fill="#f4f6f8" stroke="#d6dee4" stroke-dasharray="4 3"/><text x="550" y="455" font-size="12" text-anchor="middle" fill="#9aa5ae">—</text>
<text x="420" y="510" font-size="13" fill="#50606d">Question it answers:</text>
<text x="420" y="530" font-size="13" font-weight="700">does ictal tachycardia add anything,</text>
<text x="420" y="548" font-size="13" font-weight="700">especially on non-motor focal seizures (H2)</text>

<!-- Model C -->
<rect x="744" y="250" width="300" height="330" rx="12" fill="#fff" stroke="#0d6c86" stroke-width="2"/>
<text x="764" y="286" font-size="22" font-weight="700">Model C</text>
<text x="764" y="310" font-size="14" fill="#50606d">EEG + ECG + EMG + ACC · set C_eeg_ecg_emg_acc</text>
<rect x="764" y="330" width="260" height="40" rx="6" fill="#e3edfa" stroke="#2a78d6"/><text x="894" y="355" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">EEG features</text>
<rect x="764" y="380" width="260" height="40" rx="6" fill="#fde7df" stroke="#d95926"/><text x="894" y="405" font-size="14" text-anchor="middle" fill="#d95926" font-weight="700">+ ECG features</text>
<rect x="764" y="430" width="124" height="40" rx="6" fill="#def3ea" stroke="#199e70"/><text x="826" y="455" font-size="13" text-anchor="middle" fill="#199e70" font-weight="700">+ EMG</text>
<rect x="900" y="430" width="124" height="40" rx="6" fill="#ebe6f7" stroke="#6b4fbb"/><text x="962" y="455" font-size="13" text-anchor="middle" fill="#6b4fbb" font-weight="700">+ ACC</text>
<text x="764" y="510" font-size="13" fill="#50606d">Question it answers:</text>
<text x="764" y="530" font-size="13" font-weight="700">fewer false alarms / 24 h than A at</text>
<text x="764" y="548" font-size="13" font-weight="700">matched sensitivity on motor seizures (H1)</text>

<!-- Rules column -->
<rect x="1088" y="250" width="392" height="330" rx="12" fill="#fff" stroke="#d6dee4"/>
<text x="1108" y="286" font-size="22" font-weight="700">Single-signal rules</text>
<text x="1108" y="310" font-size="14" fill="#50606d">the honest baseline in every table</text>
<g font-size="13">
<rect x="1108" y="330" width="352" height="34" rx="6" fill="#fde7df"/><text x="1120" y="352" fill="#9a3412" font-weight="700">rule_hr</text><text x="1200" y="352" fill="#50606d">heart-rate rise above rolling baseline</text>
<rect x="1108" y="372" width="352" height="34" rx="6" fill="#def3ea"/><text x="1120" y="394" fill="#14532d" font-weight="700">rule_emg</text><text x="1200" y="394" fill="#50606d">EMG envelope above threshold</text>
<rect x="1108" y="414" width="352" height="34" rx="6" fill="#e3edfa"/><text x="1120" y="436" fill="#1e40af" font-weight="700">rule_eeg</text><text x="1200" y="436" fill="#50606d">EEG line length above threshold</text>
<rect x="1108" y="456" width="352" height="34" rx="6" fill="#ebe6f7"/><text x="1120" y="478" fill="#4c1d95" font-weight="700">rule_acc</text><text x="1200" y="478" fill="#50606d">movement magnitude above threshold</text>
</g>
<text x="1108" y="520" font-size="12" fill="#50606d">Thresholds tuned on the same inner split, same</text>
<text x="1108" y="538" font-size="12" fill="#50606d">3-of-5 rule. Also run: ecg_only, emg_only,</text>
<text x="1108" y="556" font-size="12" fill="#50606d">acc_only and emg_acc learned models.</text>
</g>

<!-- Arrows from sources to models (light) -->
<g stroke="#b9c7d1" stroke-width="1.5" fill="none">
<path d="M156 194 V250"/><path d="M156 194 Q156 230 520 250"/><path d="M156 194 Q156 230 880 250"/>
<path d="M390 194 Q390 230 560 250"/><path d="M390 194 Q390 230 900 250"/>
<path d="M624 194 Q624 230 820 250"/><path d="M858 194 Q858 230 960 250"/>
</g>

<!-- Shared evaluation bar -->
<path d="M206 580 V630" stroke="#0d6c86" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M550 580 V630" stroke="#0d6c86" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M894 580 V630" stroke="#0d6c86" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M1284 580 V630" stroke="#0d6c86" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="56" y="640" width="1424" height="150" rx="12" fill="#0d6c86"/>
<text x="76" y="676" font-size="20" font-weight="700" fill="#fff">One evaluation for all of them</text>
<g font-size="14" fill="#dcedf3">
<text x="76" y="706">Same 5 patient-wise folds (96 development patients) · same 4 s / 2 s windows · same inner-split threshold tuning · same 3-of-5 rule</text>
<text x="76" y="732">Event scoring (SzCORE): sensitivity · false alarms per 24 h · detection delay · event F1 — per seizure type: FBTC · focal motor · focal non-motor · unknown</text>
<text x="76" y="758">Patient-bootstrap 95 % intervals · a change is accepted only if event F1 +0.01 with P(improve) ≥ 0.90, sensitivity −0.02 max, FA/24 h +0.5 max</text>
</g>

<!-- Fusion note -->
<text x="56" y="840" font-size="15" font-weight="700">How C combines its signals</text>
<text x="56" y="864" font-size="14" fill="#50606d">Default: early fusion — one XGBoost over the concatenated feature blocks. Candidate v06: late fusion — one sub-model per signal, probabilities averaged with weights fit on the inner split;</text><text x="56" y="884" font-size="14" fill="#50606d">a flat or missing signal is dropped and the weights renormalised, so a fallen electrode degrades gracefully instead of silently.</text>
<text x="56" y="924" font-size="15" font-weight="700">What is still open</text>
<text x="56" y="948" font-size="14" fill="#50606d">Whether B beats A, and C beats B, is the result being measured on the development folds now (v01). The diagram shows the comparison design, not an outcome.</text>
<text x="56" y="980" font-size="12" fill="#9aa5ae">ICTRA · WAICY 2026 · sets and rules as defined in src/04_train_ablation.py · 17 Oct 2026</text>
</svg>
