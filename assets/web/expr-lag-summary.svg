<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" fill="#1d2b36" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1536" height="900" fill="#fff"/>
<text x="56" y="62" font-size="34" font-weight="700">After a seizure starts, how many seconds until each signal reacts?</text>
<text x="56" y="94" font-size="18" fill="#50606d">Measured on 695 real seizures from 96 patients (SeizeIT2 development set). Dot = typical (median) delay; bar = middle half of seizures.</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8a98a4"/></marker></defs>
<g font-size="15" fill="#8a98a4">
<line x1="560" y1="140" x2="1380" y2="140" stroke="#c8d2d9" stroke-width="2" marker-end="url(#ar)"/>
<text x="560" y="128" text-anchor="middle" font-weight="700" fill="#1d2b36">seizure starts</text>
<text x="760" y="128" text-anchor="middle">10 s</text><text x="960" y="128" text-anchor="middle">20 s</text><text x="1160" y="128" text-anchor="middle">30 s</text><text x="1360" y="128" text-anchor="middle">40 s</text>
</g>
<line x1="560" y1="150" x2="560" y2="790" stroke="#1d2b36" stroke-width="2" stroke-dasharray="6 5"/>
<g stroke="#eef2f4"><line x1="760" y1="150" x2="760" y2="790"/><line x1="960" y1="150" x2="960" y2="790"/><line x1="1160" y1="150" x2="1160" y2="790"/><line x1="1360" y1="150" x2="1360" y2="790"/></g>

<rect x="56" y="165" width="1424" height="190" rx="12" fill="#f6f8fa"/>
<text x="76" y="200" font-size="24" font-weight="700">Convulsive seizures</text>
<text x="76" y="224" font-size="15" fill="#50606d">(tonic-clonic) · 33 seizures</text>
<text x="76" y="262" font-size="17" font-weight="700" fill="#0d6c86">Brain first, then heart, then body.</text>
<text x="76" y="286" font-size="15" fill="#50606d">Every signal reacts in almost every seizure.</text>
<text x="76" y="308" font-size="15" fill="#50606d">Heart rate jumps by about 55 beats/min.</text>
<text x="76" y="336" font-size="14" fill="#199e70" font-weight="700">✓ Easiest case — all signals usable</text>
<g font-size="16" font-weight="700">
<text x="540" y="200" text-anchor="end" fill="#2a78d6">Brain (EEG)</text><line x1="560" y1="194" x2="1160" y2="194" stroke="#2a78d6" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="700" cy="194" r="11" fill="#2a78d6"/><text x="722" y="200" fill="#2a78d6" font-weight="400">7 s</text>
<text x="540" y="240" text-anchor="end" fill="#d95926">Heart (ECG)</text><line x1="560" y1="234" x2="1180" y2="234" stroke="#d95926" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="880" cy="234" r="11" fill="#d95926"/><text x="902" y="240" fill="#d95926" font-weight="400">16 s</text>
<text x="540" y="280" text-anchor="end" fill="#6b4fbb">Movement (ACC)</text><line x1="600" y1="274" x2="1240" y2="274" stroke="#6b4fbb" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="980" cy="274" r="11" fill="#6b4fbb"/><text x="1002" y="280" fill="#6b4fbb" font-weight="400">21 s</text>
<text x="540" y="320" text-anchor="end" fill="#199e70">Muscle (EMG)</text><line x1="760" y1="314" x2="1200" y2="314" stroke="#199e70" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="1000" cy="314" r="11" fill="#199e70"/><text x="1022" y="320" fill="#199e70" font-weight="400">22 s</text>
</g>

<rect x="56" y="370" width="1424" height="190" rx="12" fill="#fff" stroke="#e6ebee"/>
<text x="76" y="405" font-size="24" font-weight="700">Focal seizures with movement</text>
<text x="76" y="429" font-size="15" fill="#50606d">418 seizures (315 motor + 103 unclassified)</text>
<text x="76" y="467" font-size="17" font-weight="700" fill="#0d6c86">All four signals react at the same time.</text>
<text x="76" y="491" font-size="15" fill="#50606d">About 8 in 10 seizures show up on each signal —</text>
<text x="76" y="513" font-size="15" fill="#50606d">but not always the same 8. Combining signals</text>
<text x="76" y="535" font-size="15" fill="#50606d">catches more seizures, not earlier ones.</text>
<g font-size="16" font-weight="700">
<text x="540" y="405" text-anchor="end" fill="#2a78d6">Brain (EEG)</text><line x1="560" y1="399" x2="920" y2="399" stroke="#2a78d6" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="600" cy="399" r="11" fill="#2a78d6"/><text x="622" y="405" fill="#2a78d6" font-weight="400">2 s</text>
<text x="540" y="445" text-anchor="end" fill="#d95926">Heart (ECG)</text><line x1="560" y1="439" x2="880" y2="439" stroke="#d95926" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="620" cy="439" r="11" fill="#d95926"/><text x="642" y="445" fill="#d95926" font-weight="400">3 s</text>
<text x="540" y="485" text-anchor="end" fill="#6b4fbb">Movement (ACC)</text><line x1="560" y1="479" x2="860" y2="479" stroke="#6b4fbb" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="560" cy="479" r="11" fill="#6b4fbb"/><text x="582" y="485" fill="#6b4fbb" font-weight="400">0 s</text>
<text x="540" y="525" text-anchor="end" fill="#199e70">Muscle (EMG)</text><line x1="560" y1="519" x2="1160" y2="519" stroke="#199e70" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="680" cy="519" r="11" fill="#199e70"/><text x="702" y="525" fill="#199e70" font-weight="400">6 s</text>
</g>

<rect x="56" y="575" width="1424" height="205" rx="12" fill="#fff5f5" stroke="#f3c9c9"/>
<text x="76" y="610" font-size="24" font-weight="700">Focal seizures without movement</text>
<text x="76" y="634" font-size="15" fill="#50606d">(staring, confusion, sensations) · 244 seizures</text>
<text x="76" y="672" font-size="17" font-weight="700" fill="#d03b3b">4 in 10 show no change on any signal.</text>
<text x="76" y="696" font-size="15" fill="#50606d">When something does react, it is late and weak:</text>
<text x="76" y="718" font-size="15" fill="#50606d">heart rate rises only ~22 beats/min. This is the</text>
<text x="76" y="740" font-size="15" fill="#50606d">hard limit of a wearable — every model will be</text>
<text x="76" y="762" font-size="15" fill="#50606d">weakest here, and we say so.</text>
<g font-size="16" font-weight="700">
<text x="540" y="610" text-anchor="end" fill="#2a78d6">Brain (EEG)</text><line x1="560" y1="604" x2="1380" y2="604" stroke="#2a78d6" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="780" cy="604" r="11" fill="#2a78d6"/><text x="802" y="610" fill="#2a78d6" font-weight="400">11 s · reacts in 58 %</text>
<text x="540" y="650" text-anchor="end" fill="#d95926">Heart (ECG)</text><line x1="560" y1="644" x2="1120" y2="644" stroke="#d95926" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="680" cy="644" r="11" fill="#d95926"/><text x="702" y="650" fill="#d95926" font-weight="400">6 s · reacts in 58 %</text>
<text x="540" y="690" text-anchor="end" fill="#6b4fbb">Movement (ACC)</text><line x1="620" y1="684" x2="1380" y2="684" stroke="#6b4fbb" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="920" cy="684" r="11" fill="#6b4fbb"/><text x="942" y="690" fill="#6b4fbb" font-weight="400">18 s · reacts in 59 % (movement after onset)</text>
<text x="540" y="730" text-anchor="end" fill="#199e70">Muscle (EMG)</text><line x1="560" y1="724" x2="1380" y2="724" stroke="#199e70" stroke-width="10" opacity=".2" stroke-linecap="round"/><circle cx="820" cy="724" r="11" fill="#199e70"/><text x="842" y="730" fill="#199e70" font-weight="400">13 s · reacts in 59 %</text>
</g>

<rect x="56" y="800" width="1424" height="62" rx="10" fill="#0d6c86"/>
<text x="76" y="826" font-size="17" font-weight="700" fill="#fff">What this means for ICTRA</text>
<text x="76" y="850" font-size="15" fill="#dcedf3">Brain + heart + body together should catch more seizures than brain alone (what Models A → B → C test). It will not make alarms earlier, and it cannot see the ~40 % of non-motor seizures that leave no trace.</text>
<text x="56" y="888" font-size="12" fill="#9aa5ae">Change = first second the signal exceeds its own pre-seizure baseline by 3 standard deviations for 3 s. Seconds from the clinician's annotated onset. Development data; motivates H3a/H3b, tested on the locked and external sets. Source: results/expR/summary_by_group.csv.</text>
</svg>
